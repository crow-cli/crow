name: Build IDE

# crow's desktop app and web server, built per platform from
# packages/crow-gui/build.sh — the vendored VSCodium pipeline with crow's
# branding from packages/crow-gui/crow.env.
#
# Deliberately NOT triggered on push: a cold run is hours long (a pinned VS
# Code checkout, `npm ci`, gulp minify, then the Rust CLI), so a commit to
# packages/ must not silently burn a runner. Run it by hand, or push a v* tag to
# also publish the artifacts to a release.
#
# Known gaps, in the order they should be closed:
#   - Windows arm64, macOS universal: one arch per runner.
#   - Signing: macOS artifacts are unsigned without the CERTIFICATE_OSX_*
#     secrets, and the .dmg is created by build.sh rather than the vendored
#     notarize path. Windows installers are unsigned without a code-signing
#     certificate.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build
        type: choice
        default: all
        options:
          - all
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - win32-x64
      assets:
        description: Package release artifacts (tarballs, .deb/.rpm, .zip/.dmg, setup .exe)
        type: boolean
        default: true
  push:
    tags:
      - "v*"

# No concurrency group on purpose: a queued run behind an hours-long one is
# useless for bisecting a failure, and GitHub's 20-job limit fits this matrix
# several times over.
permissions: {}

jobs:
  plan:
    # The job matrix is built here rather than written inline: `matrix` is not
    # available to a job-level `if:` (the dispatch event is rejected outright
    # with "Unrecognized named-value: 'matrix'"), so the platform to build is
    # selected by filtering this table before the matrix exists.
    name: Pick platforms
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: pick
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          # linux-x64 runs on ubuntu-22.04, not latest: the .deb/.rpm Depends
          # come from the HOST dpkg-shlibdeps (vscodium/patches/user/03), so an
          # older base keeps the packages installable on older distros.
          ALL='[
            {"name":"linux-x64","runner":"ubuntu-22.04","arch":"x64","platform":"linux","tree":"linux","heap":"8192","packages":"--deb --rpm"},
            {"name":"linux-arm64","runner":"ubuntu-24.04-arm","arch":"arm64","platform":"linux","tree":"linux","heap":"8192","packages":"--deb --rpm"},
            {"name":"darwin-x64","runner":"macos-15-intel","arch":"x64","platform":"osx","tree":"darwin","heap":"12288","packages":""},
            {"name":"darwin-arm64","runner":"macos-15","arch":"arm64","platform":"osx","tree":"darwin","heap":"12288","packages":""},
            {"name":"win32-x64","runner":"windows-2022","arch":"x64","platform":"windows","tree":"win32","heap":"8192","packages":""}
          ]'
          # jq -c keeps the result on ONE line: a multi-line value needs the
          # here-doc form of $GITHUB_OUTPUT, and `echo "x={...}"` of a pretty
          # JSON array is rejected as "Invalid format".
          if [[ -z "${PLATFORM}" || "${PLATFORM}" == "all" ]]; then
            selected="$( jq -c . <<<"${ALL}" )"
          else
            selected="$( jq -c --arg want "${PLATFORM}" 'map(select(.name == $want))' <<<"${ALL}" )"
          fi
          if [[ "${selected}" == "[]" ]]; then
            echo "::error::unknown platform '${PLATFORM}'"
            exit 1
          fi
          echo "matrix={\"include\":${selected}}" >> "${GITHUB_OUTPUT}"

      # RELEASE_VERSION is derived ONCE here instead of being left to get_repo.sh
      # in each of the five build jobs. Its patch component is
      #   TIME_PATCH=$( printf "%04d" $(($(date +%-j) * 24 + $(date +%-H))) )
      # — day-of-year times 24 plus the hour — so it rolls over every hour, and
      # jobs that do not all start inside the same UTC hour stamp different
      # product versions into the same release. Run 41241370051 (tag v0.1.0)
      # built 1.135.07317 on linux-x64 and 1.135.07316 on the other four, so
      # that release shipped two genuinely different builds of one tag and no
      # filename distinguished them.
      #
      # get_repo.sh already supports an externally-set RELEASE_VERSION: it
      # validates the shape, re-derives MS_TAG from it, and refuses to continue
      # unless that matches the pinned upstream/<quality>.json. So this is a
      # supported hook, not a patch to the vendored pipeline. The checks below
      # are its checks, run in a job that costs ten seconds rather than five
      # that cost an hour each.
      - id: version
        run: |
          MS_TAG="$( jq -r '.tag' packages/crow-gui/vscodium/upstream/stable.json )"
          TIME_PATCH="$( printf '%04d' $(( $(date +%-j) * 24 + $(date +%-H) )) )"
          RELEASE_VERSION="${MS_TAG}${TIME_PATCH}"
          if [[ ! "${RELEASE_VERSION}" =~ ^([0-9]+\.[0-9]+\.[0-5])[0-9]+$ ]]; then
            echo "::error::derived RELEASE_VERSION '${RELEASE_VERSION}' does not match get_repo.sh's pattern"
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "${MS_TAG}" ]]; then
            echo "::error::RELEASE_VERSION '${RELEASE_VERSION}' re-derives MS_TAG '${BASH_REMATCH[1]}', not the pinned '${MS_TAG}'"
            exit 1
          fi
          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "plan: RELEASE_VERSION=${RELEASE_VERSION} (MS_TAG=${MS_TAG} TIME_PATCH=${TIME_PATCH})"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 420
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # gulp minify needs a heap well past node's default. 8192 is enough on
      # linux and windows; the macOS arm runner has 7GB of RAM and dies in
      # compile-src with "Ineffective mark-compacts near heap limit", so it gets
      # 12288 — the same split the vendored macOS workflows use.
      MAX_OLD_SPACE_SIZE: ${{ matrix.heap }}
      # Pinned by `plan` so all five platforms stamp one product version.
      # get_repo.sh takes the else-branch when this is set and validates it
      # against upstream/stable.json instead of deriving it from the clock.
      RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          # The checkout tree, node_modules and the packaged app trees together
          # are ~15GB; the preinstalled toolchains are not needed.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libkrb5-dev is what VSCodium's own CI installs for the native
          # modules; fakeroot + dpkg-dev are for --deb, rpm for --rpm.
          sudo apt-get install -y --no-install-recommends \
            libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev \
            fakeroot dpkg-dev rpm jq unzip

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: |
          # jq edits product.json (prepare_vscode.sh), unzip unpacks the bundled
          # vsixs (bundle-exts.sh) and 7z builds the release zip
          # (build/windows/prepare_assets.sh). 7z ships with the image; jq and
          # unzip are installed here if it does not, rather than failing an hour
          # into the build.
          for tool in jq unzip 7z; do
            if command -v "${tool}" >/dev/null 2>&1; then
              continue
            fi
            case "${tool}" in
              7z) choco install -y --no-progress 7zip ;;
              *)  choco install -y --no-progress "${tool}" ;;
            esac
            if ! command -v "${tool}" >/dev/null 2>&1; then
              echo "::error::${tool} missing and could not be installed"
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/crow-gui/vscodium/.nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust toolchain
        run: |
          # The packaged `crow` CLI (vscode/cli) and the Rust agent TUI in
          # crates/crow-client both build with the host rustup toolchain, which
          # every runner image ships. build_cli.sh adds the explicit target.
          rustup show active-toolchain
          cargo --version

      - name: Build
        env:
          # Rust CLI download endpoint + product.json URLs come from
          # crow.env; first-run builds fetch ~340MB of VS Code, so the token
          # only matters for its rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--os "${{ matrix.platform }}" --arch "${{ matrix.arch }}")
          if [[ "${{ inputs.assets }}" != "false" ]]; then
            ARGS+=(--assets ${{ matrix.packages }})
          fi
          echo "crow-gui: build.sh ${ARGS[*]}"
          ./packages/crow-gui/build.sh "${ARGS[@]}"

      - name: Show what was produced
        run: |
          echo "=== packaged trees"
          ls -d packages/crow-gui/vscodium/VSCode-* \
                packages/crow-gui/vscodium/vscode-reh-* 2>/dev/null || true
          echo "=== assets"
          ls -lh packages/crow-gui/vscodium/assets/ 2>/dev/null || true

      # Uploaded before the smoke test on purpose: a packaging bug should not
      # cost the artifacts that prove what was built.
      #
      # The condition is spelled by EVENT, not by the input alone, because a
      # tag push has no inputs at all: `inputs.assets` is null there, and
      # `null != false` is FALSE — so `if: inputs.assets != false` skipped this
      # step on exactly the one trigger that publishes a release. Observed in
      # run 41241370051 (tag v0.1.0): five green build jobs, "Upload assets"
      # skipped on every one, then `release` downloaded zero `crow-ide-*`
      # artifacts, never created `dist/`, and died on `ls -lh dist/` with exit
      # 2. "Only package when asked" has to mean "package unless a dispatch
      # explicitly said no".
      - name: Upload assets
        if: github.event_name != 'workflow_dispatch' || inputs.assets
        uses: actions/upload-artifact@v4
        with:
          name: crow-ide-${{ matrix.name }}
          path: packages/crow-gui/vscodium/assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Smoke-test the desktop app
        run: |
          # The Electron app cannot start headless, so prove the packaged tree
          # rather than launching it: the workbench bundle, the branded
          # product.json and crow's built-in extensions.
          #
          # The tree is VSCode-<tree>-<arch>. `tree` is not `platform`: --os osx
          # writes VSCode-darwin-*, --os windows writes VSCode-win32-*.
          APP_DIR=packages/crow-gui/vscodium/VSCode-${{ matrix.tree }}-${{ matrix.arch }}
          if [[ "${{ matrix.platform }}" == "osx" ]]; then
            APP_DIR="${APP_DIR}/Crow.app/Contents/Resources/app"
          else
            APP_DIR="${APP_DIR}/resources/app"
          fi
          # A packaged build has sources bundled: out/main.js is the Electron
          # main process, out/vs/workbench/workbench.desktop.main.js the
          # workbench (there is no out/vs/code/electron-main/ in a packaged
          # tree — that path only exists in a dev checkout).
          # Each check says what it looked for: a bare `test -f` fails silently
          # and the log then shows a step that "just failed".
          for f in out/main.js out/vs/workbench/workbench.desktop.main.js; do
            [[ -f "${APP_DIR}/${f}" ]] || { echo "::error::missing ${APP_DIR}/${f}"; exit 1; }
            echo "ok   ${f}"
          done
          for d in extensions/crow-acp extensions/ms-python.python; do
            [[ -d "${APP_DIR}/${d}" ]] || { echo "::error::missing ${APP_DIR}/${d}"; exit 1; }
            echo "ok   ${d}"
          done
          node -e '
            const p = require("./'"${APP_DIR}"'/product.json");
            const bad = [];
            if (p.applicationName !== "crow") bad.push("applicationName=" + p.applicationName);
            if (p.nameShort !== "Crow") bad.push("nameShort=" + p.nameShort);
            if (!p.dataFolderName.includes("crow")) bad.push("dataFolderName=" + p.dataFolderName);
            if (JSON.stringify(p).includes("vscodium")) bad.push("carries a vscodium string");
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
            console.log("product.json OK:", p.applicationName, p.nameShort, p.dataFolderName);
          '

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: crow-ide-*
          merge-multiple: true
          path: dist

      - name: Check what will be published
        run: ls -lh dist/

      # The release's index of its own assets, published beside them as
      # crow-manifest.json. It exists because the asset filenames carry the
      # date-derived VS Code product version — tag v0.1.1 ships
      # crow_1.135.07321_amd64.deb — so a downloader that knows the tag cannot
      # construct a filename, and the alternative is the GitHub API at 60
      # unauthenticated calls/hour/IP. The manifest is reachable with no API
      # call at releases/latest/download/crow-manifest.json, and it carries a
      # sha256 for every asset including the Windows installers, which the
      # vendored pipeline ships no checksums for.
      #
      # Each build job contributed dist/crow-ide-<platform>-<arch>.json inside
      # its crow-ide-* artifact; those fragments are inputs, not assets, and the
      # `files:` globs below do not match .json so they stay unpublished.
      #
      # This step is also where the pin in `plan` is verified after the fact:
      # merge fails on a RELEASE_VERSION skew between platforms, on a fragment
      # naming a file that is missing, and on any asset no fragment claimed.
      # It costs seconds and the artifacts are already uploaded, so a failure
      # here is cheap and re-running this job alone is enough to recover.
      - name: Build the asset manifest
        run: |
          ./packages/crow-gui/manifest.sh merge \
            --dist-dir dist \
            --tag "${GITHUB_REF#refs/tags/}" \
            --repository "${GITHUB_REPOSITORY}" \
            --out dist/crow-manifest.json
          jq '{tag, release_version, vscode_tag, base_url,
               platforms: (.platforms | to_entries
                           | map({(.key): (.value.assets | keys)}) | add)}' \
            dist/crow-manifest.json

      # One .sha256/.sha1 beside each Linux and macOS asset; Windows produces
      # none, and the globs are merged across all five platforms so the pair
      # still matches.
      #
      # That note lives OUTSIDE the `files:` block on purpose. `files: |` is a
      # YAML block scalar — a literal string — so a `#` line inside it is not a
      # comment, it is another pattern. action-gh-release split it out, matched
      # nothing, and with fail_on_unmatched_files it failed the step BEFORE
      # uploading anything: run 41260927128 built all five platforms green and
      # published zero IDE assets to v0.1.1 because of one comment line.
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/crow-manifest.json
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            dist/*.sha256
            dist/*.sha1
          # Without this an unmatched glob publishes an assetless release and
          # exits 0 — the failure mode crow-cli's own v0.1.35..v0.1.48 shipped.
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true